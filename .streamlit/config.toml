[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
port = 8080

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#007bff"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#2c3e50"

[client]
showErrorDetails = false