[server]
# Server configuration for both local and Render deployment
headless = true
address = "0.0.0.0"
port = 8501

# Session management
maxUploadSize = 200
maxMessageSize = 200

# Connection settings
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = true

# Performance settings
runOnSave = false
allowRunOnSave = false

[browser]
# Browser settings
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[client]
# Client-side settings for better performance
showErrorDetails = true

[logger]
# Logging configuration
level = "info"
messageFormat = "%(asctime)s %(message)s"

[theme]
# Theme settings
base = "light"