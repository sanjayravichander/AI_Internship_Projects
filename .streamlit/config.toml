[global]
# Streamlit Cloud Configuration for Public Deployment
developmentMode = false
showWarningOnDirectExecution = false

[server]
# Server configuration for cloud deployment
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 100
maxMessageSize = 200

[browser]
# Browser configuration
gatherUsageStats = false
showErrorDetails = false

[theme]
# Default theme (users can still toggle)
primaryColor = "#007bff"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8f9fa"
textColor = "#2c3e50"
font = "sans serif"

[client]
# Client configuration
caching = true
displayEnabled = true
showErrorDetails = false

[runner]
# Runner configuration for better performance
magicEnabled = true
installTracer = false
fixMatplotlib = true
postScriptGC = true
fastReruns = true
enforceSerializableSessionState = false

[logger]
# Logging configuration
level = "info"
messageFormat = "%(asctime)s %(message)s"

[deprecation]
# Handle deprecation warnings
showPyplotGlobalUse = false