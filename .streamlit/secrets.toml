# ========================================
# STREAMLIT CLOUD SECRETS CONFIGURATION
# ========================================
# This file contains the structure for secrets.
# In Streamlit Cloud, these will be set through the web interface.
# DO NOT commit actual secrets to version control!

# ========================================
# API KEYS (Set these in Streamlit Cloud Secrets)
# ========================================
GROQ_API_KEY = "your_groq_api_key_here"
OPENAI_API_KEY = "your_openai_api_key_here"
HUGGING_FACE_API_KEY = "your_hf_api_key_here"
EMAIL_ADDRESS = "your_email@gmail.com"
EMAIL_PASSWORD = "your_app_password_here"
WEATHER_API_KEY = "your_weather_api_key_here"

# ========================================
# USAGE LIMITS & QUOTAS
# ========================================
# Daily limits for public users
DAILY_GROQ_REQUESTS = 1000
DAILY_OPENAI_REQUESTS = 100
DAILY_EMAIL_SENDS = 50
DAILY_WEATHER_REQUESTS = 500

# Per-session limits
SESSION_GROQ_REQUESTS = 50
SESSION_OPENAI_REQUESTS = 10
SESSION_EMAIL_SENDS = 5
SESSION_WEATHER_REQUESTS = 20

# Rate limiting (requests per minute)
GROQ_RATE_LIMIT = 30
OPENAI_RATE_LIMIT = 10
EMAIL_RATE_LIMIT = 2
WEATHER_RATE_LIMIT = 10

# ========================================
# APPLICATION SETTINGS
# ========================================
DEFAULT_LANGUAGE = "en"
DEFAULT_TIMEZONE = "UTC"
MAX_UPLOAD_SIZE = 50
DEBUG_MODE = false
ENABLE_ANALYTICS = true

# Model configurations
GROQ_MODEL = "llama-3.3-70b-versatile"
GROQ_TEMPERATURE = 0.7
GROQ_MAX_TOKENS = 1000

# Vector database settings
VECTOR_DB_TYPE = "faiss"
EMBEDDING_MODEL = "sentence-transformers/all-MiniLM-L6-v2"

# Cache settings
ENABLE_CACHE = true
CACHE_TTL = 3600

# ========================================
# DEPLOYMENT SETTINGS
# ========================================
DEPLOYMENT_MODE = "production"
ENABLE_USAGE_TRACKING = true
SHOW_USAGE_STATS = true
ENABLE_RATE_LIMITING = true
GRACEFUL_DEGRADATION = true